<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
    <title>小橘3号</title>
    <style>
/* =========================================================
 * mobile.css — 小橘3号 移动端 MA1 骨架样式
 * 规格来源：_dev/docs/design_mobile_ui.md §二/§三/§四/§五/§六/§八
 *          design_mobile_architecture.md §四（键盘/视口硬规）
 * 令牌与桌面同源：#fafafa / #ffffff / #2563eb / #22c55e / #f59e0b / #dc2626
 * 图标：全部内联 SVG（Lucide/Feather 线性风），零 Emoji（AGENTS.md UI 图标铁律）
 * ========================================================= */

:root {
    /* MA2.1 令牌对齐桌面（队长指令：视觉色值严格复用桌面端 CSS 变量）：
     * 值=index.html :root 同名令牌（--color-primary #203170 系） */
    --bg-drawer: #fafafa;          /* 抽屉底色（桌面侧栏同值） */
    --bg-chat: #f9fbfe;            /* 聊天区底色（桌面 --color-bg-chat 同值） */
    --primary: #203170;            /* 主色（桌面 --color-primary 同值：标题/用户气泡/发送钮） */
    --primary-hover: #2f4488;      /* 主色悬停（桌面 --color-primary-hover 同值） */
    --ok: #2fa24c;                 /* 状态绿（桌面 --color-success 同值） */
    --warn: #f59e0b;               /* 状态橙（失联横幅/橙点） */
    --danger: #e0433f;             /* 状态红（桌面 --color-danger 同值） */
    --text-1: #1f2937;
    --text-2: #6b7280;
    --border: #e0e4ec;             /* 分隔线（桌面 --color-border 同值） */
    --fill: #eef2fb;               /* 输入框/折叠条底（桌面 --color-progress-track 同值） */
    --radius-bubble: 12px;         /* 气泡 12px（UI 文档 §八） */
    --radius-card: 12px;           /* 卡片 12px */
    --radius-btn: 10px;            /* 按钮 10px */
    --page-margin: 16px;           /* 页面边距 16px */
}

* { box-sizing: border-box; }
[hidden] { display: none !important; }

html, body { height: 100%; }

body {
    margin: 0;
    background: var(--bg-chat);
    color: var(--text-1);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
                 "Helvetica Neue", "PingFang SC", "Microsoft YaHei", sans-serif;
    font-size: 16px;               /* 移动正文 16px 底线（UI 文档 §三） */
    line-height: 1.5;
    overflow: hidden;              /* 页面级永不滚动，滚动只属于消息流 */
    -webkit-tap-highlight-color: transparent;
}

button { font: inherit; color: inherit; touch-action: manipulation; }
button:not(:disabled) { cursor: pointer; }
button:disabled { cursor: default; }

/* ==================== 三段布局（UI 文档 §二） ==================== */
.app {
    height: 100vh;
    height: 100dvh;                /* resizes-content 下键盘弹出随布局视口收缩 */
    display: flex;
    flex-direction: column;
}

/* ---------- 顶栏 56px ---------- */
.topbar {
    flex: none;
    background: var(--bg-chat);
    border-bottom: 1px solid var(--border);
    padding-top: env(safe-area-inset-top, 0px);   /* 状态栏/挖孔不遮挡顶栏 */
}
.topbar-row {
    height: 56px;
    display: flex;
    align-items: center;
    gap: 4px;
    padding: 0 16px 0 4px;
}
.topbar-title {
    flex: 1;
    margin: 0;
    font-size: 17px;               /* 标题 17px（UI 文档 §三） */
    font-weight: 600;
}

.icon-btn {
    flex: none;
    width: 48px;                   /* 汉堡菜单钮 48px 热区（UI 文档 §二） */
    height: 48px;
    display: flex;
    align-items: center;
    justify-content: center;
    border: none;
    background: transparent;
    border-radius: 12px;
    color: var(--text-1);
}
.icon-btn:active { transform: scale(0.97); }   /* 按压反馈（UI 文档 §八） */

/* ---------- 连接状态点（绿/橙） ---------- */
.conn-dot {
    flex: none;
    display: inline-block;
    width: 12px;
    height: 12px;
    border-radius: 50%;
}
.conn-dot--ok   { background: var(--ok);   box-shadow: 0 0 0 3px rgba(34, 197, 94, 0.18); }
.conn-dot--warn { background: var(--warn); box-shadow: 0 0 0 3px rgba(245, 158, 11, 0.18); }

/* ---------- 失联橙横幅（默认 hidden；MA3 探活触发，恢复自动消失） ---------- */
.conn-banner {
    position: fixed;
    top: 0;
    left: 0;
    right: 0;
    z-index: 70;                   /* 高于抽屉 60/遮罩 50：失联必须可见 */
    display: flex;
    align-items: center;
    gap: 8px;
    padding: calc(10px + env(safe-area-inset-top, 0px)) var(--page-margin) 10px;
    background: var(--warn);
    color: #fff;
    font-size: 14px;
    font-weight: 500;
}

/* ---------- 消息流：flex:1 独立滚动 ---------- */
.stream-wrap {
    flex: 1;
    min-height: 0;                 /* flex 子项允许收缩 */
    position: relative;
    background: var(--bg-chat);
}
.stream {
    position: absolute;
    inset: 0;
    overflow-y: auto;
    -webkit-overflow-scrolling: touch;
    overscroll-behavior: contain;
    padding: var(--page-margin);
}

/* ---------- 气泡：fit-content + max-width:80%（UI 文档 §三） ---------- */
.msg-row { display: flex; }
.msg-row + .msg-row { margin-top: 12px; }             /* 跨发送方 12px */
.msg-row--them { justify-content: flex-start; }
.msg-row--me   { justify-content: flex-end; }
.msg-row--them + .msg-row--them,
.msg-row--me   + .msg-row--me   { margin-top: 4px; }  /* 同侧聚合 4px */

.bubble {
    width: fit-content;            /* 短消息贴内容，不撑满 */
    max-width: 80%;                /* 长文本 80% 封顶 */
    padding: 10px 14px;
    border-radius: var(--radius-bubble);
    font-size: 16px;
    line-height: 1.5;
    overflow-wrap: anywhere;
    word-break: break-word;
}
.bubble--them {
    background: var(--bg-chat);    /* 小橘左侧白卡 */
    border: 1px solid var(--border);
    box-shadow: 0 1px 2px rgba(31, 41, 55, 0.06);
}
.bubble--me {
    background: var(--primary);    /* 用户右侧深蓝 */
    color: #fff;
}

/* ---------- 思维链折叠条（默认收起；点击展开/收起） ---------- */
.think-card { width: fit-content; max-width: 80%; }
.think-toggle {
    min-height: 44px;              /* 触控目标 ≥44px */
    display: inline-flex;
    align-items: center;
    gap: 8px;
    padding: 0 12px;
    border: none;
    border-radius: var(--radius-card);
    background: var(--fill);
    color: var(--text-2);
    font-size: 13px;               /* 次要文字 13px */
}
.think-toggle:active { transform: scale(0.97); }
.think-chevron { transition: transform 0.2s ease; }
.think-toggle.is-open .think-chevron { transform: rotate(180deg); }
.think-body {
    margin-top: 4px;
    padding: 10px 14px;
    background: var(--bg-chat);
    border: 1px solid var(--border);
    border-radius: var(--radius-card);
}
.think-steps {
    margin: 0;
    padding-left: 18px;
    font-size: 13px;
    color: var(--text-2);
    line-height: 1.7;
}

/* ---------- HITL 确认卡（按钮纵排全宽 ≥44px；UI 文档 §三） ---------- */
.hitl-card {
    width: fit-content;
    max-width: 80%;
    min-width: 240px;
    padding: 12px;
    background: var(--bg-chat);
    border: 1px solid var(--border);
    border-radius: var(--radius-card);
    box-shadow: 0 1px 2px rgba(31, 41, 55, 0.06);
}
.hitl-head {
    display: flex;
    align-items: center;
    gap: 8px;
    color: var(--primary);
    font-size: 14px;
    font-weight: 600;
}
.hitl-summary {
    margin: 8px 0 12px;
    font-size: 16px;
    line-height: 1.5;
}
.hitl-actions {
    display: flex;
    flex-direction: column;        /* 按钮纵排 */
    gap: 8px;
}
.hitl-btn {
    width: 100%;                   /* 全宽 */
    min-height: 44px;              /* 确认卡钮 ≥44px */
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    border: none;
    border-radius: var(--radius-btn);
    font-size: 16px;
    font-weight: 500;
}
.hitl-btn:active { transform: scale(0.97); }
.hitl-btn--approve { background: var(--primary); color: #fff; }
.hitl-btn--reject {
    background: var(--bg-chat);
    color: var(--danger);
    border: 1px solid var(--danger);
}
.hitl-input {
    margin-top: 8px;
    width: 100%;
    min-height: 44px;
    padding: 10px 12px;
    border: 1px solid var(--border);
    border-radius: var(--radius-btn);
    background: var(--fill);
    color: var(--text-1);
    font-size: 16px;               /* 输入类 ≥16px 防聚焦缩放（架构文档 §四.4） */
}
.hitl-input:focus { outline: 2px solid var(--primary); outline-offset: -1px; }

/* ---------- 回到底部悬浮钮（≥44px，右下浮现，淡入 0.2s） ---------- */
.scroll-fab {
    position: absolute;
    right: var(--page-margin);
    bottom: var(--page-margin);
    z-index: 5;
    min-height: 44px;
    display: flex;
    align-items: center;
    gap: 6px;
    padding: 0 14px;
    border: 1px solid var(--border);
    border-radius: 22px;
    background: var(--bg-chat);
    color: var(--primary);
    font-size: 13px;
    box-shadow: 0 4px 12px rgba(31, 41, 55, 0.16);
    opacity: 0;
    visibility: hidden;
    pointer-events: none;
    transition: opacity 0.2s ease, visibility 0.2s ease;
}
.scroll-fab.is-visible { opacity: 1; visibility: visible; pointer-events: auto; }
.scroll-fab:active { transform: scale(0.97); }

/* ---------- 底部输入条（键盘上方；安全区 padding-bottom） ---------- */
.composer {
    flex: none;
    background: var(--bg-chat);
    border-top: 1px solid var(--border);
    padding-bottom: env(safe-area-inset-bottom, 0px);   /* 手势条安全区硬规 */
}
.composer-row {
    display: flex;
    align-items: flex-end;
    gap: 8px;
    padding: 8px 12px;
}
.composer-input {
    flex: 1;
    min-width: 0;
    min-height: 42px;              /* 1 行：22px 行高 + 上下 10px */
    max-height: 108px;             /* 4 行封顶（22px × 4 + 20px），超出内部滚动 */
    padding: 10px 14px;
    border: none;
    border-radius: var(--radius-card);
    background: var(--fill);
    color: var(--text-1);
    font-size: 16px;               /* 硬规：输入框字号 16px（防 iOS 聚焦缩放） */
    line-height: 22px;
    resize: none;
    outline: none;
}
.composer-input:focus { box-shadow: 0 0 0 2px rgba(37, 99, 235, 0.25); }

.round-btn {
    flex: none;
    width: 48px;                   /* 语音/发送钮 48px（UI 文档 §五） */
    height: 48px;
    display: flex;
    align-items: center;
    justify-content: center;
    border: none;
    border-radius: 50%;
    background: transparent;
    color: var(--text-2);
}
.round-btn:active { transform: scale(0.97); }
.round-btn--primary { background: var(--primary); color: #fff; }
.round-btn--primary:disabled { background: #d1d5db; color: #fff; }   /* 空内容灰态 */

/* ==================== modal drawer（UI 文档 §四） ==================== */
.drawer-scrim {
    position: fixed;
    inset: 0;
    z-index: 50;
    background: rgba(0, 0, 0, 0.45);   /* 半透明遮罩，阻断下层交互 */
    opacity: 0;
    visibility: hidden;
    transition: opacity 0.25s ease, visibility 0.25s ease;
}
.drawer-scrim.is-shown { opacity: 1; visibility: visible; }

.drawer {
    position: fixed;
    top: 0;
    bottom: 0;
    left: 0;
    z-index: 60;
    width: min(85vw, 320px);       /* UI 文档 §四 */
    display: flex;
    flex-direction: column;
    background: var(--bg-drawer);
    border-right: 1px solid var(--border);
    transform: translateX(-102%);  /* 从左滑入 */
    transition: transform 0.25s ease;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
}
.drawer.is-open { transform: translateX(0); box-shadow: 0 0 24px rgba(31, 41, 55, 0.18); }

.drawer-head {
    flex: none;
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 16px;
    border-bottom: 1px solid var(--border);
}
.drawer-avatar {
    flex: none;
    width: 44px;
    height: 44px;
    display: flex;
    align-items: center;
    justify-content: center;
    border-radius: 50%;
    background: var(--primary);
    color: #fff;
}
.drawer-name { font-size: 16px; font-weight: 600; }
.drawer-conn {
    display: flex;
    align-items: center;
    gap: 6px;
    margin-top: 2px;
    font-size: 13px;
    color: var(--text-2);
}
.drawer-conn .conn-dot { width: 8px; height: 8px; }

.drawer-nav {
    flex: 1;
    overflow-y: auto;
    padding: 8px 0;
}
.drawer-foot {
    flex: none;
    border-top: 1px solid var(--border);
    padding: 8px 0;
}

.drawer-item {
    display: flex;
    align-items: center;
    gap: 12px;
    width: calc(100% - 16px);
    min-height: 48px;              /* 条目高 ≥48px（UI 文档 §四） */
    margin: 2px 8px;
    padding: 0 12px;
    border: none;
    border-radius: var(--radius-btn);
    background: transparent;
    font-size: 16px;
    text-align: left;
    color: var(--text-1);
}
.drawer-item svg { flex: none; color: var(--text-2); }
.drawer-item:active { transform: scale(0.98); }
.drawer-item.is-active {
    background: rgba(37, 99, 235, 0.10);
    color: var(--primary);
    font-weight: 500;
}
.drawer-item.is-active svg { color: var(--primary); }

/* ==================== 横屏不破版（UI 文档 §七，可选级） ==================== */
@media (orientation: landscape) {
    /* 三段 flex 布局天然自适应高度，无需额外裁剪；此处仅约束气泡上限避免
       超宽屏长句一行铺满全屏（80% 封顶仍生效） */
    .stream { padding-top: 12px; }
}

/* ==================== MA2 流式态补强（think 骨架/错误气泡/来源标签/HITL 结果） ==================== */
.think-skeleton {
    height: 12px;
    border-radius: 6px;
    background: linear-gradient(90deg, #eceff4 25%, #f6f8fb 50%, #eceff4 75%);
    background-size: 200% 100%;
    animation: think-pulse 1.2s ease-in-out infinite;
    margin: 6px 0;
    list-style: none;
}
.think-skeleton:first-child { width: 82%; }
.think-skeleton:last-child { width: 58%; }
@keyframes think-pulse {
    0% { background-position: 200% 0; }
    100% { background-position: -200% 0; }
}
.think-line { list-style: none; font-size: 13px; color: #475569; line-height: 1.5; }
.bubble--error {
    border: 1px solid rgba(220, 38, 38, 0.25);
    background: #fef2f2;
    color: #b91c1c;
}
.msg-src {
    display: inline-block;
    margin-top: 6px;
    font-size: 11px;
    opacity: 0.65;
}
.hitl-result {
    margin-top: 8px;
    font-size: 12px;
    color: #475569;
}
.hitl-btn:disabled { opacity: 0.45; }

/* ==================== MA2.1 面板层（待办/快捷指令/连接设置/关于） ==================== */
.panel {
    position: fixed;
    inset: 0;
    z-index: 120;                    /* 高于抽屉(100)/横幅(70)，低于 toast(200) */
    background: var(--bg-chat);
    display: flex;
    flex-direction: column;
}
.panel[hidden] { display: none; }
.panel-head {
    display: flex;
    align-items: center;
    gap: 8px;
    height: 56px;
    padding: 0 12px;
    border-bottom: 1px solid var(--border);
    background: var(--bg-drawer);
    flex: 0 0 auto;
}
.panel-title { font-size: 17px; font-weight: 700; color: var(--text-1); margin: 0; }
.panel-body {
    flex: 1;
    overflow-y: auto;
    padding: var(--page-margin);
}
.panel-group {
    font-size: 13px;
    font-weight: 700;
    color: var(--text-2);
    margin: 14px 0 6px;
}
.panel-hint { font-size: 13px; color: var(--text-2); line-height: 1.6; margin: 10px 0; }
.panel-card {
    background: var(--bg-drawer);
    border: 1px solid var(--border);
    border-radius: var(--radius-card);
    padding: 12px 14px;
    margin-bottom: 12px;
}
.panel-line { font-size: 14px; color: var(--text-1); line-height: 1.8; }
.panel-btn {
    display: block;
    width: 100%;
    min-height: 44px;
    margin: 8px 0;
    padding: 10px 14px;
    font-size: 14px;
    border: 1px solid var(--border);
    border-radius: var(--radius-btn);
    background: var(--bg-drawer);
    color: var(--text-1);
}
.panel-btn--warn { color: var(--danger); border-color: rgba(224, 67, 63, 0.35); }
.todo-row {
    display: flex;
    align-items: center;
    gap: 10px;
    width: 100%;
    min-height: 48px;                /* 触控目标 ≥44px（UI 文档硬规） */
    padding: 8px 10px;
    border: 1px solid var(--border);
    border-radius: var(--radius-btn);
    background: var(--bg-drawer);
    margin: 6px 0;
    text-align: left;
}
.todo-row--done { opacity: 0.55; }
.todo-row--done .todo-text { text-decoration: line-through; }
.todo-dot {
    flex: 0 0 auto;
    width: 18px;
    height: 18px;
    border-radius: 50%;
    border: 2px solid var(--primary);
}
.todo-row--done .todo-dot { background: var(--primary); }
.todo-text { flex: 1; font-size: 14px; color: var(--text-1); line-height: 1.4; }
.todo-pri {
    flex: 0 0 auto;
    font-size: 11px;
    color: var(--primary);
    border: 1px solid var(--primary);
    border-radius: 6px;
    padding: 1px 6px;
}
.quick-grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 10px;
    margin-top: 8px;
}
.quick-chip {
    min-height: 48px;
    padding: 10px;
    font-size: 14px;
    border: 1px solid var(--primary);
    border-radius: var(--radius-btn);
    background: var(--bg-drawer);
    color: var(--primary);
}

/* 吐司（轻提示）：z 最高，底部悬浮不挡输入条 */
.toast {
    position: fixed;
    left: 50%;
    bottom: calc(env(safe-area-inset-bottom, 0px) + 96px);
    transform: translateX(-50%) translateY(8px);
    z-index: 200;
    max-width: 86vw;
    padding: 10px 16px;
    font-size: 13px;
    color: #fff;
    background: rgba(31, 41, 55, 0.92);
    border-radius: 10px;
    opacity: 0;
    transition: opacity 0.25s ease, transform 0.25s ease;
    pointer-events: none;
}
.toast.is-shown { opacity: 1; transform: translateX(-50%) translateY(0); }
.toast--err { background: rgba(224, 67, 63, 0.95); }

/* 麦克风录音态：红点脉冲（录制中再点一次=停止转写） */
.round-btn.mic-rec { border-color: var(--danger); color: var(--danger); }
.round-btn.mic-rec::after {
    content: "";
    position: absolute;
    top: 6px;
    right: 6px;
    width: 9px;
    height: 9px;
    border-radius: 50%;
    background: var(--danger);
    animation: mic-pulse 1s ease-in-out infinite;
}
@keyframes mic-pulse {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.25; }
}

/* ==================== 能力分级门控（2026-10-31 队长指令：L2/L0 自适应降级） ====================
 * 纯手机端（探活不可达，body 能力属性=降级态）：隐藏"没有电脑根本用不了"的
 * 重型模块——待办面板(/api/todos)、快捷指令(系统自检/选股等)、语音转写
 * (电脑端 Whisper)、附件上传(电脑端 doc_ingest)。
 * 保留：聊天输入+发送（断网入离线草稿箱）、探活横幅、离线草稿箱、连接设置
 * （本地配置）、关于。
 * 🔴 本块必须位于全部规则之后（媒体查询/先声明被后声明压死前科）——
 *    用 !important 双保险确保 display:none 不被任何后级选择器翻案。 */
body[data-caps='l0'] [data-needs-server] { display: none !important; }
    </style>
    <script>


    /* 最高优先级事故兜底（2026-10-31）：任何 JS 错误大字上屏+持久留痕 */
    (function () {
        function showErr(title, detail) {

/* =========================================================
 * xj3_network_core.js — 小橘3号 双端共享网络核心（唯一实现）
 * 队长红线（2026-10-31）：纯网络通信+流式解析只写一次——桌面 console.js 与
 * 移动端 mobile.js 都经 <script> 引入本文件，杜绝人肉拷贝漂移（防双端 Bug 不同步）。
 * 本文件零 DOM 依赖：只做 探活/流式编排/帧解析/看门狗，渲染全部留在调用方回调。
 *
 * 溯源：编排逻辑拷贝自 console.js@7897bbc sendMessageStream（L5042-5278）与
 * probeBase（L2687），提取为纯网络形态；提取后由桌面真链路 E2E 回归护航。
 * 同步清单：_dev/mobile_sync_checklist.md（本文件=唯一实现，清单降级为"谁在消费"）。
 * ========================================================= */
(function () {
    'use strict';

    var XJ3Net = {};

    /* ---------- 探活（桌面/移动共用；默认 5s 超时，可传 timeoutMs） ---------- */
    XJ3Net.probeBase = function (base, timeoutMs) {
        var ctl = new AbortController();
        var timer = setTimeout(function () { ctl.abort(); }, timeoutMs || 5000);
        return fetch((base || '') + '/api/health', { signal: ctl.signal })
            .then(function (r) { return r.json(); })
            .then(function (j) { return !!(j && j.status === 'ok'); })
            .catch(function () { return false; })
            .finally(function () { clearTimeout(timer); });
    };

    /* ---------- 流式对话编排 ----------
     * opts = {
     *   message: string                     用户消息原文
     *   base: ''|url                        API 前缀（同源传 ''）
     *   aborter: AbortController|null       调用方-owned 总闸（桌面排队条"立即执行"
     *                                       经 __xj3Abort.abort() 中断；看门狗也走它）
     *   onFrame: fn(etype, data)            每帧回调（think/tool/answer/done/error）
     * }
     * 返回 Promise：流干净结束 → resolve({ok:true})；
     *              失败 → reject(Error)，看门狗触发时 err.xj3Watchdog=true。
     * 看门狗口径（桌面同款）：首帧 30s / 帧间 90s（每帧喂狗）/ 总闸 190s。
     * 帧解析：按 \n\n 切帧 → event:/data: 行 → JSON.parse（坏帧抛错=调用方处置）。 */
    XJ3Net.chatStream = function (opts) {
        return new Promise(function (resolve, reject) {
            var watchdogFired = false;
            var aborter = opts.aborter || new AbortController();
            var firstTimer = setTimeout(function () { fireWatchdog(); }, 30000);
            var frameTimer = firstTimer;
            var totalTimer = setTimeout(function () { fireWatchdog(); }, 190000);

            function fireWatchdog() {
                watchdogFired = true;
                try { aborter.abort(); } catch (e) { /* 已中断 */ }
            }
            function pat() {
                clearTimeout(frameTimer);
                frameTimer = setTimeout(function () { fireWatchdog(); }, 90000);
            }
            function clearAll() {
                clearTimeout(firstTimer);
                clearTimeout(frameTimer);
                clearTimeout(totalTimer);
            }

            fetch((opts.base || '') + '/api/chat/stream', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ message: opts.message }),
                signal: aborter.signal
            }).then(function (res) {
                if (!res.ok || !res.body) {
                    throw new Error('stream unavailable');
                }
                var reader = res.body.getReader();
                var decoder = new TextDecoder();
                var buf = '';

                function pump() {
                    return reader.read().then(function (chunk) {
                        if (chunk.done) {
                            clearAll();
                            resolve({ ok: true });
                            return;
                        }
                        buf += decoder.decode(chunk.value, { stream: true });
                        var idx;
                        while ((idx = buf.indexOf('\n\n')) !== -1) {
                            var frame = buf.slice(0, idx);
                            buf = buf.slice(idx + 2);
                            var etype = 'message';
                            var payload = '';
                            frame.split('\n').forEach(function (l) {
                                if (l.indexOf('event:') === 0) { etype = l.slice(6).trim(); }
                                else if (l.indexOf('data:') === 0) { payload += l.slice(5).trim(); }
                            });
                            if (!payload) { continue; }
                            pat();
                            opts.onFrame(etype, JSON.parse(payload));
                        }
                        return pump();
                    });
                }
                return pump();
            }).catch(function (err) {
                clearAll();
                var e = (err instanceof Error) ? err : new Error(String(err));
                if (watchdogFired) { e.xj3Watchdog = true; }
                reject(e);
            });
        });
    };

    window.XJ3Net = XJ3Net;
    /* 桩环境（node 烟雾/非浏览器宿主）兜底：window 与全局对象可能不是
     * 同一对象——裸标识符 XJ3Net 必须可达（console.js 裸引用） */
    if (typeof globalThis !== 'undefined') {
        try { globalThis.XJ3Net = XJ3Net; } catch (e) { /* 忽略 */ }
    }
})();

    /* ==================== 7. 富文本渲染（拷贝自 console.js@ee66ef0：
     *                        escapeHtml / renderRich L3540 / renderRichTables L3579） ==================== */
    function escapeHtml(s) {
        return String(s).replace(/[&<>"']/g, function (c) {
            return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
        });
    }

    function renderRichTables(text) {
        /* 表格块 → 圆角容器内横滑表格（表格只在气泡内滑动，页面级永不横滚） */
        var lines = String(text).split('\n');
        var out = [];
        var i = 0;
        function isRow(l) { return /^\s*\|.*\|\s*$/.test(l); }
        function isSep(l) { return /^\s*\|[\s:\-|]+\|\s*$/.test(l); }
        while (i < lines.length) {
            if (isRow(lines[i]) && i + 1 < lines.length && isSep(lines[i + 1])) {
                var head = lines[i].split('|').slice(1, -1);
                i += 2;
                var rows = [];
                while (i < lines.length && isRow(lines[i])) {
                    rows.push(lines[i].split('|').slice(1, -1));
                    i += 1;
                }
                var html = '<div class="md-table-wrap"><table><thead><tr>';
                head.forEach(function (c) { html += '<th>' + escapeHtml(c.trim()) + '</th>'; });
                html += '</tr></thead><tbody>';
                rows.forEach(function (r) {
                    html += '<tr>';
                    r.forEach(function (c) { html += '<td>' + escapeHtml(c.trim()) + '</td>'; });
                    html += '</tr>';
                });
                html += '</tbody></table></div>';
                out.push(html);
            } else {
                out.push(escapeHtml(lines[i]));
                i += 1;
            }
        }
        return out.join('\n');
    }

    function renderRich(text) {
        /* 转义 → 行内 code/粗体/标题/换行（console.js renderRich 精简镜像） */
        var s = escapeHtml(text);
        s = s.replace(/`([^`\n]+)`/g, '<code class="md-code">$1</code>');
        s = s.replace(/\*\*([^*\n]+)\*\*/g, '<strong>$1</strong>');
        s = s.replace(/^### (.+)$/gm, '<div class="md-h">$1</div>');
        return s;
    }

    function renderFinal(text) {
        /* done 后正文富化：表格优先，其余走 renderRich（逐行保留换行结构） */
        if (/^\s*\|.*\|\s*$/m.test(text) && text.indexOf('|') !== -1) {
            return renderRichTables(text);
        }
        return renderRich(text);
    }

                appendErrorBubble('❌ ⏱️ 长时间无响应已自动中断——请直接重试');
                followIfPinned();
                failed = true;
                return;
            }
            /* 流式失败 → legacy 单帧回退（拷贝自 console.js sendMessageLegacy L5281） */
            fetch(BASE + '/api/chat', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ message: text })
            }).then(function (r) { return r.json(); }).then(function (j) {
                if (j && j.code === 200 && j.data && j.data.reply) {
                    var d = j.data;
                    handleEvent('done', { reply: d.reply, source: d.source });
                } else {
                    appendErrorBubble('❌ ' + ((j && j.error) || '请求失败，稍后再试'));
                }
            }).catch(function () {
                appendErrorBubble('❌ 网络异常——请检查与主机的连接');
                followIfPinned();
                failed = true;
            });
        }).finally(function () {
            /* 看门狗/总闸已移交 XJ3Net 核心（唯一实现）——此处只管生成态收尾 */
            generating = false;
            refreshSend();
            if (doneCb) { doneCb(!failed); }   /* 单次上报（成功=补发成功出队） */
        });
    }

    /* ==================== 10. 历史加载（拷贝自 console.js loadHistory L4852） ==================== */
    function loadHistory() {
        fetch(BASE + '/api/history').then(function (r) { return r.json(); })
            .then(function (res) {
                if (!res || res.code !== 200 || !res.data || !res.data.messages) { return; }
                var msgs = res.data.messages;
                msgs.forEach(function (m, idx) {
                    setTimeout(function () {
                        if (m.role === 'user') { appendUserMessage(m.content); }
                        else { appendBotMessage(m.content, m.source); }
                    }, Math.min(idx * 45, 400));
                });
            })
            .catch(function () { /* 历史失败不阻塞主流程（探活横幅已示警） */ });
    }

    /* ==================== 11. 事件总线（拷贝自 console.js initUiEvents L4457：
     *                        bus_reply L4497 + collab_msg L4526 的移动端形态） ==================== */
    function initUiEvents() {
        if (typeof EventSource !== 'function') { return; }
        /* 排雷批：指数退避重连（2s 起、30s 封顶+抖动）——多 tab/后台线程
         * 同时连 /api/events 时不再以固定 3s 硬重试打后端；恢复即清退避。 */
        var es = null;
        var esBackoff = 2000;
        var esTimer = null;
        function esConnect() {
            es = new EventSource(BASE + '/api/events');
            es.onopen = function () {
                esBackoff = 2000;         /* 恢复清退避 */
                linkCheck();
            };
            es.onerror = function () {
                setConnState(false);      /* SSE 断=连接异常，横幅示警 */
                try { es.close(); } catch (e) { /* 忽略 */ }
                es = null;
                if (esTimer) { clearTimeout(esTimer); }
                var delay = esBackoff + Math.floor(Math.random() * 800);
                esBackoff = Math.min(30000, esBackoff * 2);
                esTimer = setTimeout(esConnect, delay);
            };
            es.addEventListener('bus_reply', busReplyHandler);
            es.addEventListener('collab_msg', collabMsgHandler);
        }
        var busReplyHandler = function (ev) {
            try {
                var d = JSON.parse(ev.data);
                if (d && d.reply) { appendBotMessage(d.reply, d.source); }
            } catch (e) { /* 坏帧丢弃 */ }
        };
        var collabMsgHandler = function (ev) {
            try {
                var m = JSON.parse(ev.data);
                if (m && m.hitl) { renderHitlCard(m); }
            } catch (e) { /* 坏帧丢弃 */ }
        };
        esConnect();
    }

    /* ==================== 12. HITL 确认卡（镜像 console.js renderCollabMsg L4542 /
     *                        sendCollab L4663；移动端=老板手机审批面） ==================== */
    function renderHitlCard(m) {
        var options = (m.options && m.options.length) ? m.options
            : ['同意', '驳回', '暂缓', '修改方案'];
        var summary = String(m.summary || m.preview || '小橘请求确认').slice(0, 120);
        var row = el('div', 'msg-row msg-row--them');
        var card = el('div', 'hitl-card');
        card.setAttribute('role', 'group');
        card.setAttribute('aria-label', '操作确认卡');
        var head = el('div', 'hitl-head');
        head.innerHTML = ICON_CLIP;
        head.appendChild(el('span', 'hitl-title', '⏸ 需要老板确认'));
        card.appendChild(head);
        card.appendChild(el('p', 'hitl-summary', summary));
        var actions = el('div', 'hitl-actions');
        var done = false;

        function settle() {
            done = true;
            Array.prototype.forEach.call(actions.querySelectorAll('button'), function (b) {
                b.disabled = true;
            });
            customInput.disabled = true;
        }
        function sendCollab(text) {
            if (done) { return; }
            settle();
            fetch(BASE + '/api/collab/send', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ text: text })   /* 契约=body.text（桌面 sendCollab 同款） */
            }).then(function (r) { return r.json(); })
                .then(function (j) {
                    var ok = j && (j.code === 200 || j.code === 0);
                    card.appendChild(el('div', 'hitl-result',
                        ok ? '✅ 已写回总线，等待小橘执行' : '❌ 写回失败，请到桌面控制台处理'));
                })
                .catch(function () {
                    card.appendChild(el('div', 'hitl-result', '❌ 网络异常，请重试或到桌面处理'));
                });
            followIfPinned();
        }
        options.forEach(function (opt) {
            var b = el('button', 'hitl-btn');
            b.type = 'button';
            if (opt === '同意') { b.className += ' hitl-btn--approve'; }
            if (opt === '驳回') { b.className += ' hitl-btn--reject'; }
            b.innerHTML = (opt === '同意' ? ICON_CHECK : (opt === '驳回' ? ICON_X : ''))
                + '<span>' + escapeHtml(opt) + '</span>';
            b.addEventListener('click', function () {
                sendCollab('选择了：' + opt + ' — ' + summary.slice(0, 60));
            });
            actions.appendChild(b);
        });
        card.appendChild(actions);
        var customInput = el('input', 'hitl-input');
        customInput.type = 'text';
        customInput.placeholder = '自定义回复（可选）…';
        customInput.setAttribute('aria-label', '自定义回复');
        customInput.addEventListener('keydown', function (e) {
            if (e.key === 'Enter') {
                var v = customInput.value.trim();
                if (v) { sendCollab('自定义指令：' + v); }
            }
        });
        card.appendChild(customInput);
        row.appendChild(card);
        streamAppend(row);
        followIfPinned();
    }

    /* ==================== 6.5 面板系统（MA2.1：抽屉条目的真实去处） ====================
     * 待办=真实列表（/api/todos + done/reopen）；快捷指令=chip 直发；
     * 连接设置=连接信息+刷新+清缓存；关于=版本+免责。 */
    function handleNav(nav) {
        if (nav === 'chat') { closePanel(); return; }
        openPanel(nav);
    }

    var panel = $('#mPanel');
    var panelTitle = $('#mPanelTitle');
    var panelBody = $('#mPanelBody');
    var panelBack = $('#mPanelBack');
    if (panelBack) { panelBack.addEventListener('click', closePanel); }

    function openPanel(nav) {
        if (!panel) { return; }
        panel.hidden = false;
        var titles = { todo: '待办', quick: '快捷指令', settings: '连接设置', about: '关于' };
        panelTitle.textContent = titles[nav] || '';
        panelBody.textContent = '';
        if (nav === 'todo') { renderTodoPanel(panelBody); }
        else if (nav === 'quick') { renderQuickPanel(panelBody); }
        else if (nav === 'settings') { renderSettingsPanel(panelBody); }
        else if (nav === 'about') { renderAboutPanel(panelBody); }
    }

    function closePanel() {
        if (panel) { panel.hidden = true; panelBody.textContent = ''; }
    }

    function toast(text, isError) {
        var t = el('div', 'toast' + (isError ? ' toast--err' : ''), text);
        document.body.appendChild(t);
        setTimeout(function () { t.classList.add('is-shown'); }, 30);
        setTimeout(function () {
            t.classList.remove('is-shown');
            setTimeout(function () { t.remove(); }, 300);
        }, 2600);
    }

    /* ---- 待办面板：/api/todos + done/reopen ---- */
    function renderTodoPanel(body) {
        body.textContent = '加载中…';
        fetch(BASE + '/api/todos').then(function (r) { return r.json(); })
            .then(function (res) {
                body.textContent = '';
                if (!res || res.code !== 200 || !res.data || !res.data.todos) {
                    body.appendChild(el('div', 'panel-hint', '待办加载失败'));
                    return;
                }
                var todos = res.data.todos || [];
                var groups = [
                    { key: 'pending', label: '未完成', items: todos.filter(function (t) { return t.status === 'pending'; }) },
                    { key: 'done', label: '已完成', items: todos.filter(function (t) { return t.status !== 'pending'; }) },
                ];
                groups.forEach(function (g) {
                    if (!g.items.length) { return; }
                    body.appendChild(el('div', 'panel-group', g.label + '（' + g.items.length + '）'));
                    g.items.forEach(function (t) {
                        var row = el('button', 'todo-row' + (g.key === 'done' ? ' todo-row--done' : ''));
                        row.type = 'button';
                        var dot = el('span', 'todo-dot');
                        var txt = el('span', 'todo-text', String(t.content || t.text || t.title || ''));
                        row.appendChild(dot);
                        row.appendChild(txt);
                        if (t.priority) {
                            row.appendChild(el('span', 'todo-pri', String(t.priority)));
                        }
                        row.addEventListener('click', function () {
                            var isDone = g.key === 'done';
                            var action = isDone ? 'reopen' : 'done';
                            fetch(BASE + '/api/todos/' + t.id + '/' + action, { method: 'POST' })
                                .then(function (r) { return r.json(); })
                                .then(function (j) {
                                    if (j && j.code === 200) { renderTodoPanel(body); }
                                    else { toast((j && j.error) || '操作失败', true); }
                                })
                                .catch(function () { toast('网络异常', true); });
                        });
                        body.appendChild(row);
                    });
                });
                if (!todos.length) {
                    body.appendChild(el('div', 'panel-hint', '待办清单是空的——对我说"记个待办"就行。'));
                }
            })
            .catch(function () { body.textContent = '待办加载失败（网络异常）'; });
    }

    /* ---- 快捷指令面板：chip 直发（对齐桌面 PLUGIN_QUICK_ACTIONS 可用子集） ---- */
    function renderQuickPanel(body) {
        body.appendChild(el('div', 'panel-hint', '点一下=直接对小橘说这句话：'));
        var grid = el('div', 'quick-grid');
        [
            { label: '记个待办', text: '帮我记个待办：' },
            { label: '系统自检', text: '系统自检' },
            { label: '掷骰子', text: '掷骰子' },
            { label: '帮我选股', text: '帮我选股' },
        ].forEach(function (q) {
            var chip = el('button', 'quick-chip', q.label);
            chip.type = 'button';
            chip.addEventListener('click', function () {
                closePanel();
                if (q.text.endsWith('：')) {
                    input.value = q.text;      /* 需要补内容的指令：填入输入框 */
                    input.focus();
                    autoGrow();
                    refreshSend();
                } else {
                    sendMessage(q.text);       /* 完整指令：直接发 */
                }
            });
            grid.appendChild(chip);
        });
        body.appendChild(grid);
    }

    /* ---- 连接设置面板 ---- */
    function renderSettingsPanel(body) {
        body.textContent = '';
        var info = el('div', 'panel-card');
        info.appendChild(el('div', 'panel-line', '连接地址：' + (BASE || '同源（当前页面托管地址）')));
        var online = !banner.hidden ? '重连中' : '已连接';
        info.appendChild(el('div', 'panel-line', '连接状态：' + online));
        body.appendChild(info);
        var addrWrap = el('div', 'panel-card');
        addrWrap.appendChild(el('div', 'panel-line', '服务器地址（APK/跨机场景填写，如 http://192.168.31.x:5003）：'));
        var addrInput = el('input', 'hitl-input');
        addrInput.type = 'text';
        addrInput.value = BASE;
        addrInput.placeholder = '留空=同源';
        addrInput.setAttribute('aria-label', '服务器地址');
        addrWrap.appendChild(addrInput);
        var saveBtn = el('button', 'panel-btn', '保存地址并重连');
        saveBtn.type = 'button';
        saveBtn.addEventListener('click', function () {
            var v = addrInput.value.trim().replace(/\/+$/, '');
            try { localStorage.setItem('xj3_mobile_base', v); } catch (e) { /* 忽略 */ }
            location.reload();
        });
        addrWrap.appendChild(saveBtn);
        body.appendChild(addrWrap);
        var act = el('button', 'panel-btn', '立即检测连接');
        act.type = 'button';
        act.addEventListener('click', function () {
            linkCheck();
            toast('已发起连接检测');
        });
        body.appendChild(act);
        var clear = el('button', 'panel-btn panel-btn--warn', '清除本页数据并刷新');
        clear.type = 'button';
        clear.addEventListener('click', function () {
            try { localStorage.clear(); sessionStorage.clear(); } catch (e) { /* 忽略 */ }
            location.reload();
        });
        body.appendChild(clear);
        body.appendChild(el('div', 'panel-hint',
            '说明：当前经同源/局域网直连主机。独立中继通道（账号绑定+多终端管控）已立项调研，见《独立中继服务器架构设计方案》。'));
    }

    /* ---- 关于面板 ---- */
    function renderAboutPanel(body) {
        body.textContent = '加载中…';
        fetch(BASE + '/api/status').then(function (r) { return r.json(); })
            .then(function (res) {
                body.textContent = '';
                var v = (res && res.data && res.data.version) || '未知';
                var card = el('div', 'panel-card');
                card.appendChild(el('div', 'panel-line', '小橘3号 移动端'));
                card.appendChild(el('div', 'panel-line', '服务版本：v' + v));
                card.appendChild(el('div', 'panel-line', '定位：本地个人辅助 AI 管家'));
                body.appendChild(card);
                body.appendChild(el('div', 'panel-hint',
                    '⚠️ 免责提示：自动化操作可能存在误差，重要文件请提前备份。'));
            })
            .catch(function () {
                body.textContent = '';
                body.appendChild(el('div', 'panel-hint', '版本信息获取失败（离线？）'));
            });
    }

    /* ==================== 6.6 语音输入（MA2.1：麦克风必须活） ====================
     * getUserMedia 权限申请 → MediaRecorder 录音 → POST /api/stt/transcribe
     * （PyAV 解码+Whisper，与桌面 STT 同门槛）→ 文字填入输入框（可改后发送）。 */
    var mediaStream = null;
    var mediaRecorder = null;
    var chunks = [];

    function setMicRecording(on) {
        micBtn.classList.toggle('mic-rec', on);
        micBtn.setAttribute('aria-label', on ? '停止录音' : '语音输入');
    }

    function bindMic() {
        micBtn.addEventListener('click', function () {
            if (mediaRecorder && mediaRecorder.state === 'recording') {
                mediaRecorder.stop();          /* 停止→转写→填输入框 */
                return;
            }
            if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
                toast('当前环境不支持麦克风（需 HTTPS/权限）', true);
                return;
            }
            navigator.mediaDevices.getUserMedia({ audio: true }).then(function (stream) {
                mediaStream = stream;
                try {
                    mediaRecorder = new MediaRecorder(stream);
                } catch (e) {
                    toast('录音器初始化失败：' + e.message, true);
                    stream.getTracks().forEach(function (t) { t.stop(); });
                    return;
                }
                chunks = [];
                mediaRecorder.ondataavailable = function (e) {
                    if (e.data && e.data.size) { chunks.push(e.data); }
                };
                mediaRecorder.onstop = function () {
                    mediaStream.getTracks().forEach(function (t) { t.stop(); });
                    setMicRecording(false);
                    var blob = new Blob(chunks, { type: mediaRecorder.mimeType || 'audio/webm' });
                    if (blob.size < 1000) { toast('录音太短', true); return; }
                    toast('转写中…');
                    var fd = new FormData();
                    fd.append('audio', blob, 'voice.webm');
                    fetch(BASE + '/api/stt/transcribe', { method: 'POST', body: fd })
                        .then(function (r) { return r.json(); })
                        .then(function (j) {
                            if (j && j.code === 200) {
                                var text = (j.data && j.data.text) || '';
                                if (text) {
                                    input.value = (input.value ? input.value + ' ' : '') + text;
                                    input.focus();
                                    autoGrow();
                                    refreshSend();
                                    toast('已转写');
                                } else {
                                    toast((j.data && j.data.note) || '没听清', true);
                                }
                            } else {
                                toast((j && j.error) || '转写失败', true);
                            }
                        })
                        .catch(function () { toast('转写请求失败', true); });
                };
                mediaRecorder.start();
                setMicRecording(true);
                toast('开始录音，再点一次结束');
            }).catch(function (e) {
                toast('麦克风权限被拒绝，请在系统设置中允许 APP 使用麦克风后重试', true);
            });
        });
    }

    /* ==================== 6.7 附件上传（MA3：复用 doc_ingest 解析链） ==================== */
    function bindAttach() {
        var attachBtn = $('#mAttachBtn');
        var fileInput = $('#mAttachFile');
        if (!attachBtn || !fileInput) { return; }
        attachBtn.addEventListener('click', function () { fileInput.click(); });
        fileInput.addEventListener('change', function () {
            var file = fileInput.files && fileInput.files[0];
            fileInput.value = '';                 /* 允许重复选同一文件 */
            if (!file) { return; }
            toast('附件上传中：' + file.name);
            var fd = new FormData();
            fd.append('file', file, file.name);
            fetch(BASE + '/api/attach_upload', { method: 'POST', body: fd })
                .then(function (r) { return r.json(); })
                .then(function (j) {
                    if (j && j.code === 200) {
                        toast('📎 附件已就绪：' + (j.data && j.data.name) + '（随下一条消息发送）');
                    } else {
                        toast('❌ ' + ((j && j.error) || '附件上传失败'), true);
                    }
                })
                .catch(function () { toast('附件上传失败（网络）', true); });
        });
    }

    /* ==================== 初始化 ==================== */
    function init() {
        bindDrawer();
        bindStream();
        bindComposer();
        bindMic();
        bindAttach();
        bindViewportFallback();
        following = true;
        scrollToBottom(false);
        startLinkCheck();     /* 探活横幅触发源（MA2 接入） */
        loadHistory();        /* 刷新加载后端历史 */
        initUiEvents();       /* 总线：bus_reply+collab_msg HITL */
    }

    if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', init);
    } else {
        init();
    }

    /* 验收/调试钩子（唯一全局出口） */
    window.__xj3Mobile = {
        setConnState: setConnState,
        sendMessage: sendMessage,
        linkCheck: linkCheck
    };
})();
    </script>

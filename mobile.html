<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <!-- 架构文档 §四硬规（一行写全）：interactive-widget=resizes-content 键盘弹出收缩布局视口
         （Chrome/Android WebView 108+）；viewport-fit=cover + env(safe-area-inset-*) 手势条/挖孔安全区 -->
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
    <title>小橘3号</title>
    <!-- 相对路径引用（未来经 /console/mobile.html 托管）；版本参数防 WebView 缓存旧 JS（架构文档 §五） -->
    <link rel="stylesheet" href="./mobile.css?v=20261031">
    <script src="./mobile.js?v=20261031" defer></script>
</head>
<body>
    <!-- 失联橙横幅（UI 文档 §二：失联时出现，恢复自动消失；默认隐藏，MA3 探活接入触发） -->
    <div id="mConnBanner" class="conn-banner" role="alert" hidden>
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>
        <span>连接断开，正在重连…</span>
    </div>

    <!-- 抽屉遮罩（半透明 scrim，垫于抽屉之下，阻断下层交互） -->
    <div id="mScrim" class="drawer-scrim" aria-hidden="true"></div>

    <!-- modal drawer：宽 min(85vw, 320px)，左滑入；点遮罩/选中条目/右滑均可关闭 -->
    <aside id="mDrawer" class="drawer" role="dialog" aria-modal="true" aria-label="导航抽屉" aria-hidden="true">
        <div class="drawer-head">
            <div class="drawer-avatar" aria-hidden="true">
                <!-- lucide bot（lucide-static v0.544.0，2026-10-31 unpkg 查证） -->
                <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 8V4H8"/><rect width="16" height="12" x="4" y="8" rx="2"/><path d="M2 14h2"/><path d="M20 14h2"/><path d="M15 13v2"/><path d="M9 13v2"/></svg>
            </div>
            <div class="drawer-head-text">
                <div class="drawer-name">小橘3号</div>
                <div class="drawer-conn">
                    <span id="mDrawerConnDot" class="conn-dot conn-dot--ok" aria-hidden="true"></span>
                    <span id="mDrawerConnText">已连接</span>
                </div>
            </div>
        </div>
        <nav class="drawer-nav" aria-label="主导航">
            <button class="drawer-item is-active" type="button" data-nav="chat" aria-current="page">
                <!-- feather message-circle（同 console.js ICON_SVGS.message） -->
                <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
                <span>聊天</span>
            </button>
            <button class="drawer-item" type="button" data-nav="todo">
                <!-- feather check-square -->
                <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="9 11 12 14 22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/></svg>
                <span>待办</span>
            </button>
            <button class="drawer-item" type="button" data-nav="quick">
                <!-- feather zap（同 console.js ICON_SVGS.zap） -->
                <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/></svg>
                <span>快捷指令</span>
            </button>
        </nav>
        <div class="drawer-foot">
            <button class="drawer-item" type="button" data-nav="settings">
                <!-- feather settings（同 console.js ICON_SVGS.settings） -->
                <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
                <span>连接设置</span>
            </button>
            <button class="drawer-item" type="button" data-nav="about">
                <!-- feather info -->
                <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="10"/><line x1="12" y1="16" x2="12" y2="12"/><line x1="12" y1="8" x2="12.01" y2="8"/></svg>
                <span>关于</span>
            </button>
        </div>
    </aside>

    <!-- 三段布局：顶栏 56px / 消息流 flex:1 独立滚动 / 底部输入条 -->
    <div id="mApp" class="app">
        <header id="mTopbar" class="topbar">
            <div class="topbar-row">
                <button id="mMenuBtn" class="icon-btn" type="button" aria-label="打开导航抽屉" aria-controls="mDrawer" aria-expanded="false">
                    <!-- feather menu（同 index.html:1637 sidebar-toggle 同款） -->
                    <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
                </button>
                <h1 class="topbar-title">小橘3号</h1>
                <span id="mConnDot" class="conn-dot conn-dot--ok" role="img" aria-label="连接状态：已连接" title="已连接"></span>
            </div>
        </header>

        <div id="mStreamWrap" class="stream-wrap">
            <main id="mStream" class="stream" aria-label="消息流">
                <!-- MA1 骨架演示静态数据；MA2 起 sendMessage/SSE 动态渲染（架构文档 §三） -->

                <!-- 4 条气泡：短消息贴内容（fit-content）、长文本 80% 封顶；小橘左白卡 / 用户右深蓝 -->
                <div class="msg-row msg-row--them">
                    <div class="bubble bubble--them">早上好，队长。今天周五。</div>
                </div>
                <div class="msg-row msg-row--me">
                    <div class="bubble bubble--me">今天有什么安排？</div>
                </div>
                <div class="msg-row msg-row--them">
                    <div class="bubble bubble--them">已为你梳理好今天的日程：上午 10 点有迭代评审会，记得带上 APK 回归结论；下午 2 点开始是打包窗口，我会提前 15 分钟提醒你。另外待办队列里还有 3 个 P2 缺陷，需要的话我可以先列个清单。</div>
                </div>
                <div class="msg-row msg-row--me">
                    <div class="bubble bubble--me">好，先把 P2 清出来，修完跑一遍全仓测试，全绿以后再向你汇报结果。</div>
                </div>

                <!-- 思维链折叠条（默认收起；图标 SVG，非 Emoji；与桌面思维链交互一致） -->
                <div class="msg-row msg-row--them">
                    <div class="think-card">
                        <button id="mThinkToggle" class="think-toggle" type="button" aria-expanded="false" aria-controls="mThinkBody">
                            <!-- lucide brain（lucide-static v0.544.0，2026-10-31 unpkg 查证） -->
                            <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 18V5"/><path d="M15 13a4.17 4.17 0 0 1-3-4 4.17 4.17 0 0 1-3 4"/><path d="M17.598 6.5A3 3 0 1 0 12 5a3 3 0 1 0-5.598 1.5"/><path d="M17.997 5.125a4 4 0 0 1 2.526 5.77"/><path d="M18 18a4 4 0 0 0 2-7.464"/><path d="M19.967 17.483A4 4 0 1 1 12 18a4 4 0 1 1-7.967-.517"/><path d="M6 18a4 4 0 0 1-2-7.464"/><path d="M6.003 5.125a4 4 0 0 0-2.526 5.77"/></svg>
                            <span>已思考（0.8 秒）</span>
                            <!-- feather chevron-down -->
                            <svg class="think-chevron" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="6 9 12 15 18 9"/></svg>
                        </button>
                        <div id="mThinkBody" class="think-body" hidden>
                            <ol class="think-steps">
                                <li>解析意图：询问今日日程与待办优先级。</li>
                                <li>调用日程与待办插件，汇总本机数据。</li>
                                <li>按时间线组织回复，并标注提醒时间点。</li>
                            </ol>
                        </div>
                    </div>
                </div>

                <!-- HITL 确认卡：摘要行 + 同意/驳回纵排全宽 ≥44px + 自定义输入框（UI 文档 §三） -->
                <div class="msg-row msg-row--them">
                    <div class="hitl-card" role="group" aria-label="操作确认卡">
                        <div class="hitl-head">
                            <!-- feather clipboard -->
                            <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"/><rect x="8" y="2" width="8" height="4" rx="1" ry="1"/></svg>
                            <span class="hitl-title">执行确认</span>
                        </div>
                        <p class="hitl-summary">小橘请求执行：清理 7 天前的临时缓存文件（约 120 MB）。</p>
                        <div class="hitl-actions">
                            <button class="hitl-btn hitl-btn--approve" type="button">
                                <!-- feather check -->
                                <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="20 6 9 17 4 12"/></svg>
                                <span>同意</span>
                            </button>
                            <button class="hitl-btn hitl-btn--reject" type="button">
                                <!-- feather x（同 console.js ICON_SVGS.x） -->
                                <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
                                <span>驳回</span>
                            </button>
                        </div>
                        <input id="mHitlInput" class="hitl-input" type="text" placeholder="自定义回复（可选）…" aria-label="自定义回复">
                    </div>
                </div>
            </main>

            <!-- 回到底部悬浮钮：脱离底部（>80px）浮现，点击回底并恢复跟随（UI 文档 §六） -->
            <button id="mScrollBottomBtn" class="scroll-fab" type="button" aria-label="回到底部">
                <!-- feather arrow-down -->
                <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><line x1="12" y1="5" x2="12" y2="19"/><polyline points="19 12 12 19 5 12"/></svg>
                <span>回到底部</span>
            </button>
        </div>

        <footer id="mComposer" class="composer">
            <div class="composer-row">
                <textarea id="mInput" class="composer-input" rows="1" placeholder="输入消息…" aria-label="消息输入框"></textarea>
                <button id="mMicBtn" class="round-btn" type="button" aria-label="语音输入" title="语音输入（MA3 接入）">
                    <!-- feather mic -->
                    <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2"/><line x1="12" y1="19" x2="12" y2="23"/><line x1="8" y1="23" x2="16" y2="23"/></svg>
                </button>
                <button id="mSendBtn" class="round-btn round-btn--primary" type="button" aria-label="发送" title="发送" disabled>
                    <!-- feather send -->
                    <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>
                </button>
            </div>
        </footer>
    </div>
</body>
</html>

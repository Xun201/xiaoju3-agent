<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <!-- 移动端适配（界面文档 §7 规划落地）：无 viewport meta 为文档已知缺失 -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>小橘3号控制台</title>
    <style>
        /* ==================== 设计令牌表（界面文档 §1.3 重构为 CSS 变量） ==================== */
        /* 默认深蓝主题（保持文档"默认深蓝"现状不变） */
        :root {
            --color-primary: #203170;          /* 主色：面板标题、用户气泡底色、发送按钮 */
            --color-primary-hover: #2f4488;    /* 主色悬停 */
            --color-bg: #f4f6f9;               /* 页面底色 */
            --color-bg-chat: #f9fbfe;          /* 聊天区分层背景 */
            --color-card: #ffffff;             /* 卡片底色 */
            --color-border: #e0e4ec;           /* 分隔线 */
            --color-text-secondary: #536ba9;   /* 次级文字 */
            --color-text-hint: #9fb0d9;        /* 占位/提示文字 */
            --color-progress-track: #eef2fb;   /* 进度底槽 */
            --color-success: #2fa24c;          /* 进度条正常态 */
            --color-danger: #e0433f;           /* 警示色：CPU/内存 > 80% 变红 */
            --color-like: #ef4444;             /* 点赞激活 */
            --color-like-bg: #fef2f2;
            --color-dislike: #3b82f6;          /* 点踩激活 */
            --color-dislike-bg: #eff6ff;
            --radius-control: 8px;             /* 输入框/按钮圆角 */
            --radius-bubble: 10px;             /* 消息气泡圆角 */
            --radius-tool: 6px;                /* 工具按钮圆角 */
            --radius-card: 12px;               /* MAA 风格卡片圆角 */
            --shadow-sidebar: 2px 0 10px rgba(0,0,0,0.02);  /* 侧栏单向阴影（文档令牌） */
            --shadow-card: 0 2px 8px rgba(0,0,0,0.06);      /* MAA 卡片轻阴影（克制） */
        }
        /* 橘色主题（界面文档 §10.1 皮肤系统基础）：与狐狸娘形象同源暖橙色系，
           主色/悬停/底色/卡片/次级文字/进度/警示全套成体系；右上角按钮切换，
           localStorage 记忆，默认仍为深蓝主题。 */
        [data-theme="orange"] {
            --color-primary: #d96f2b;          /* 主色·暖橘（狐毛同源） */
            --color-primary-hover: #e8853f;    /* 悬停·亮橘 */
            --color-bg: #fdf6ee;               /* 页面底色·奶油橘白 */
            --color-bg-chat: #fffaf3;          /* 聊天区分层背景 */
            --color-card: #fffdf9;             /* 卡片底色 */
            --color-border: #f0e0cb;           /* 分隔线·浅棕 */
            --color-text-secondary: #a9683a;   /* 次级文字·棕橘 */
            --color-text-hint: #d3ae87;        /* 提示文字·浅棕 */
            --color-progress-track: #f7ebdb;   /* 进度底槽 */
            --color-success: #3f9e63;          /* 成功色（适配暖底微调） */
            --color-danger: #e0433f;           /* 警示色保持通用红 */
            --color-like: #e0433f;             /* 点赞激活·暖红 */
            --color-like-bg: #fdeeea;
            --color-dislike: #b07a4a;          /* 点踩激活·棕橘（替代冷蓝） */
            --color-dislike-bg: #faf0e2;
            --shadow-sidebar: 2px 0 10px rgba(217, 111, 43, 0.08);
            --shadow-card: 0 2px 8px rgba(217, 111, 43, 0.10);
        }

        /* ==================== 基础重置 ==================== */
        * { box-sizing: border-box; margin: 0; padding: 0; }
        /* 标签页切换显隐：.chat-history / .chat-input-area 等设了 display:flex，
           会盖掉 hidden 属性，这里统一兜底（终端记录标签页依赖） */
        [hidden] { display: none !important; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow: hidden;
            height: 100vh;
            display: flex;
            background-color: var(--color-bg);
        }

        /* ==================== 左侧监控面板（MAA 卡片化） ==================== */
        .sidebar {
            width: 33.33%;
            min-width: 300px;
            background-color: var(--color-card);
            border-right: 1px solid var(--color-border);
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 20px;
            box-shadow: var(--shadow-sidebar);
            z-index: 10;
            /* 卡片化：卡片圆角 + 轻阴影（令牌化，克制不过度重绘） */
            border-radius: var(--radius-card);
            margin: 12px;
        }
        .panel-header {
            font-size: 18px;
            font-weight: 600;
            color: var(--color-primary);
            border-bottom: 2px solid var(--color-progress-track);
            padding-bottom: 10px;
        }
        .stat-item { display: flex; flex-direction: column; gap: 8px; }
        .stat-label { font-size: 14px; color: var(--color-text-secondary); display: flex; justify-content: space-between; }
        .stat-bar-bg { width: 100%; height: 8px; background-color: var(--color-progress-track); border-radius: 4px; overflow: hidden; }
        .stat-bar-fill { height: 100%; background-color: var(--color-success); border-radius: 4px; transition: width 0.3s ease, background-color 0.3s ease; }
        .stat-value { font-size: 24px; font-weight: bold; color: var(--color-primary); }

        /* ==================== 右侧聊天区域 ==================== */
        .chat-area {
            flex: 1;
            display: flex;
            flex-direction: column;
            background-color: var(--color-bg-chat);
            position: relative;
            min-width: 0;
        }
        .chat-header {
            padding: 10px 20px;
            font-size: 16px;
            font-weight: 600;
            color: var(--color-primary);
            background-color: var(--color-card);
            border-bottom: 1px solid var(--color-border);
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .header-title { flex: 1; }
        .header-version { font-size: 12px; opacity: .55; margin-left: 8px; font-weight: normal; }
        .header-actions { display: flex; align-items: center; gap: 4px; }
        .header-btn {
            background: none;
            border: 1px solid transparent;
            border-radius: var(--radius-tool);
            font-size: 16px;
            line-height: 1;
            padding: 6px 8px;
            cursor: pointer;
            color: var(--color-text-secondary);
            transition: background 0.2s;
        }
        .header-btn:hover { background: var(--color-progress-track); }
        /* 桌面端隐藏抽屉开关（仅移动端媒体查询中显示） */
        #sidebar-toggle { display: none; }

        /* ==================== 聊天标签页（对话窗口 / 终端记录） ==================== */
        /* 终端记录入口（R3 后端 GET /api/history?source=terminal 的前端承接）：
           标签栏挂在聊天头部之下，切换右侧内容区；终端记录为只读展示
           （无输入框、清空按钮禁用、消息不带操作工具栏）。 */
        .chat-tabs {
            display: flex;
            gap: 4px;
            padding: 6px 20px 0;
            background-color: var(--color-card);
            border-bottom: 1px solid var(--color-border);
        }
        .chat-tab {
            appearance: none;
            background: none;
            border: none;
            border-bottom: 2px solid transparent;
            padding: 8px 14px;
            font-size: 14px;
            cursor: pointer;
            color: var(--color-text-secondary);
            transition: color 0.2s, border-color 0.2s;
        }
        .chat-tab:hover { color: var(--color-primary); }
        .chat-tab.active {
            color: var(--color-primary);
            font-weight: 600;
            border-bottom-color: var(--color-primary);
        }
        /* 终端记录页只读：清空按钮禁用态（灰色、禁悬停反馈） */
        .header-btn:disabled { opacity: 0.35; cursor: not-allowed; }
        .header-btn:disabled:hover { background: none; }
        /* 待办卡片（2026-10-04 待办提取）：pending 可点击标完成，done 灰显划线 */
        .todos-list { list-style: none; margin: 6px 0 0; padding: 0; max-height: 180px; overflow-y: auto; }
        /* 尾巴 1：复选框条目——完成态保留显示（划线灰显），取消钩即恢复；
           尾巴 C：P0/P1/P2 pill（active 高亮主色） */
        .todo-item { display: flex; align-items: flex-start; gap: 6px; font-size: 12px; line-height: 1.5; padding: 3px 4px; border-radius: 6px; }
        .todo-item .todo-check { margin: 2px 0 0; cursor: pointer; accent-color: var(--color-primary); flex: none; }
        .todo-item .todo-text { user-select: text; word-break: break-all; flex: 1; }
        .todo-item.done { opacity: 0.75; }
        .todo-item.done .todo-text { color: var(--color-text-hint); text-decoration: line-through; }
        .todo-item .todo-pills { display: flex; gap: 3px; flex: none; }
        .todo-pr {
            border: 1px solid var(--color-border); background: var(--color-card);
            color: var(--color-text-hint); font-size: 10px; line-height: 1;
            padding: 2px 4px; border-radius: 4px; cursor: pointer;
        }
        .todo-pr:hover { color: var(--color-primary); }
        .todo-pr.active { background: var(--color-primary); border-color: var(--color-primary); color: #ffffff; }
        /* 尾巴 F：优先级编辑模式——默认锁定（灰显禁用），点 ⚙️ 切换 */
        .todo-pr:disabled { opacity: 0.45; cursor: default; }
        .todo-pr:disabled:hover { color: var(--color-text-hint); }
        .todos-gear { cursor: pointer; margin-left: 4px; color: var(--color-text-hint); }
        .todos-gear:hover { opacity: 0.75; }
        .todos-gear.editing { color: #f59e0b; }   /* 编辑中：橙色高亮（尾巴 F2） */
        /* 尾巴 C 精确版：分区标题行（── Px ──），空分区整段不渲染 */
        .todo-group-title {
            font-size: 11px; font-weight: 600; color: var(--color-text-hint);
            letter-spacing: 1px; text-align: center;
            padding: 4px 0 2px; margin-top: 2px;
            border-top: 1px dashed var(--color-border);
        }
        .todo-group-title:first-child { border-top: none; margin-top: 0; }
        .todos-list li.todos-empty { color: var(--color-text-hint); cursor: default; font-size: 12px; padding: 3px 4px; }
        .todos-job { font-size: 12px; color: var(--color-text-hint); margin-top: 4px; }
        /* 终端记录面板（只读）：工具行 + 复用聊天气泡样式的记录列表 */
        .terminal-pane { flex: 1; display: flex; flex-direction: column; min-height: 0; }
        .terminal-toolbar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
            padding: 8px 20px;
            background-color: var(--color-card);
            border-bottom: 1px solid var(--color-border);
            font-size: 13px;
            color: var(--color-text-secondary);
        }
        .terminal-history { background-color: var(--color-bg-chat); }
        .terminal-empty {
            margin: auto;
            text-align: center;
            font-size: 13px;
            color: var(--color-text-hint);
            padding: 20px;
        }

        .chat-history {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }
        .message {
            max-width: 70%;
            padding: 10px 15px;
            border-radius: var(--radius-bubble);
            font-size: 14px;
            line-height: 1.5;
            word-wrap: break-word;
        }
        /* 气泡卡片化：轻阴影（令牌化） */
        .bot-message {
            align-self: flex-start;
            background-color: var(--color-card);
            color: var(--color-primary);
            border: 1px solid var(--color-border);
            box-shadow: var(--shadow-card);
        }
        .user-message { align-self: flex-end; background-color: var(--color-primary); color: #ffffff; }

        /* 消息气泡文本可选中复制（2026-10-04 尾巴 2）：显式启用 + 深浅两底
           各配高可见选区——深蓝底上默认选区高亮对比度低，体感"选不中" */
        .message,
        .message .bubble-content {
            user-select: text;
            -webkit-user-select: text;
        }
        .user-message ::selection,
        .user-message::selection {
            background: rgba(255, 255, 255, 0.35);
        }
        .bot-message ::selection,
        .bot-message::selection {
            background: rgba(32, 49, 112, 0.25);
        }

        /* ==================== 输入框区域 ==================== */
        .chat-input-area {
            padding: 15px 20px;
            background-color: var(--color-card);
            border-top: 1px solid var(--color-border);
            display: flex;
            gap: 10px;
        }
        .chat-input-area input {
            flex: 1;
            min-width: 0;
            padding: 10px 15px;
            border: 1px solid var(--color-border);
            border-radius: var(--radius-control);
            outline: none;
            font-size: 14px;
        }
        .chat-input-area button {
            padding: 10px 20px;
            background-color: var(--color-primary);
            color: #ffffff;
            border: none;
            border-radius: var(--radius-control);
            cursor: pointer;
            font-weight: 600;
            transition: background 0.2s;
            flex-shrink: 0;
        }
        .chat-input-area button:hover { background-color: var(--color-primary-hover); }

        /* ==================== AI 消息工具栏按钮样式 ==================== */
        .msg-tools {
            display: flex;
            gap: 10px;
            margin-top: 8px;
            opacity: 0.5;
            transition: 0.2s;
        }
        .msg-tools:hover { opacity: 1; }
        .tool-btn {
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 26px;
            height: 26px;
            border-radius: var(--radius-tool);
            transition: all 0.2s;
            color: var(--color-text-secondary);
            border: 1px solid transparent;
        }
        .tool-btn:hover {
            background: rgba(0, 0, 0, 0.05);
            color: var(--color-primary);
            border-color: rgba(0, 0, 0, 0.05);
        }
        /* 点赞、踩的激活状态颜色 */
        .tool-btn.active-like { color: var(--color-like); background: var(--color-like-bg); }
        .tool-btn.active-dislike { color: var(--color-dislike); background: var(--color-dislike-bg); }

        /* 大脑来源徽标（消费 /api/chat 返回的 source 字段） */
        .source-badge {
            display: inline-block;
            align-self: flex-start;
            font-size: 12px;
            line-height: 1;
            padding: 3px 8px;
            border-radius: var(--radius-tool);
            color: var(--color-text-secondary);
            background-color: var(--color-progress-track);
        }

        /* ==================== 思维链卡片（工具调用 <think> 块展示） ==================== */
        /* 浅灰底折叠卡片，位于消息气泡正文上方（气泡内首个子元素）。
           静态折叠口径仍为 display 切换（.think-collapsed 只藏正文，最简
           可靠，展开态正文高度不定、无需魔法数字上限）；2026-10-01 起
           自动折叠先走 .think-anim 的 300ms max-height 过渡动画（见下方
           折叠动画规则），动画完成后落回本静态口径；箭头方向用 transform
           过渡补足动效。 */
        .think-card {
            display: block;                     /* 整卡永远可见：.think-collapsed 只藏正文，绝不藏整卡 */
            background-color: #f3f4f6;          /* 浅灰背景（任务规格色） */
            border: 1px solid var(--color-border);
            border-radius: 10px;
            font-size: 13px;
            overflow: hidden;
        }
        .think-card-header {
            display: flex;
            align-items: center;
            gap: 6px;
            padding: 6px 10px;
            cursor: pointer;
            font-weight: 600;
            color: var(--color-text-secondary);
            user-select: none;
        }
        .think-card-header:hover { color: var(--color-primary); }
        .think-card-title { flex: 1; }
        .think-card-arrow {
            font-size: 11px;
            transition: transform 0.2s ease;
        }
        .think-card.think-collapsed .think-card-arrow { transform: rotate(-90deg); }
        .think-card-body {
            padding: 2px 10px 8px;
            line-height: 1.6;
            color: var(--color-text-secondary);
            white-space: pre-wrap;              /* 保留 [思考]/[计划] 的换行结构 */
            word-break: break-word;
            max-height: 260px;                  /* 展开态内容完整可见：超限滚动（任务 6） */
            overflow-y: auto;
            border-left: 3px solid #c9d6f2;     /* 左侧竖线（任务 6） */
        }
        /* 折叠态：正文 display:none（console.js 切换类名即可，无需内联样式） */
        .think-card.think-collapsed .think-card-body { display: none; }

        /* 折叠动画（2026-10-01 用户口径，DeepSeek 节奏）：思考列表全部渲染完
           等待 1.5s 后，由 console.js 挂 .think-anim 并把正文内联 max-height
           从实测可视高度过渡到 0（300ms ease 收缩）；完成后摘除 .think-anim、
           落回上方 .think-collapsed 静态折叠口径。max-height 选型：内容高度
           不定，用 clientHeight/scrollHeight 实测值过渡，无魔法数字上限；
           grid-rows 0fr/1fr 需额外包裹容器且旧引擎兼容差。 */
        .think-card.think-anim .think-card-body { transition: max-height 0.3s ease; }

        /* 思考展示期间正文气泡暂不显示（折叠完成后由 console.js 摘除
           .think-pending 显示），形成"先完整思考、收起、后出正文"的节奏 */
        .message.think-pending .bubble-content,
        .message.think-pending .source-badge,
        .message.think-pending .msg-tools { display: none; }

        /* CoT 一次性列表展示（2026-10-01 用户口径，DeepSeek 风格）：[思考]/
           [计划]/[行动] 每段单独成行，由 console.js 一次性全部插入（无逐行
           定时器）；.think-line 淡入动画对全部行同时生效（整体浮现，
           非逐行错峰闪动） */
        .think-line {
            display: flex;
            align-items: flex-start;
            gap: 6px;
            margin: 3px 0;
            opacity: 0;
            animation: thinkLineFadeIn 0.3s ease forwards;   /* 整体淡入 */
        }
        @keyframes thinkLineFadeIn {
            from { opacity: 0; transform: translateY(3px); }
            to { opacity: 1; transform: translateY(0); }
        }
        /* 阶段层级缩进（完整列表视觉）：[思考] 顶格 / [计划] 一级 / [行动] 二级 */
        .think-line.think-indent-1 { margin-left: 0; }
        .think-line.think-indent-2 { margin-left: 14px; }
        .think-line.think-indent-3 { margin-left: 28px; }
        /* 淡蓝色阶段标签小徽章（[思考]/[计划]/[行动]，基础样式） */
        .think-line-tag {
            flex-shrink: 0;
            font-size: 11px;
            line-height: 1;
            padding: 2px 6px;
            margin-top: 2px;
            border-radius: var(--radius-tool);
            color: #3b82f6;                     /* 淡蓝阶段标签 */
            background-color: #eff6ff;          /* 淡蓝底 */
            border: 1px solid #bfdbfe;
            user-select: none;
        }
        /* 阶段分色（2026-10-01 用户口径）：[思考] 蓝 / [计划] 绿 / [行动] 橙 */
        .think-line-tag.think-tag-think { color: #3b82f6; background-color: #eff6ff; border-color: #bfdbfe; }
        .think-line-tag.think-tag-plan  { color: #2fa24c; background-color: #eefaf1; border-color: #bfe6cb; }
        .think-line-tag.think-tag-action { color: #d96f2b; background-color: #fdf3ea; border-color: #f3d5ba; }
        .think-line-text {
            color: #6b7280;                     /* 灰色思考文字 */
            min-width: 0;
        }

        /* ==================== 轻提示 toast（替代 alert 占位） ==================== */
        #xiaoju3-toast {
            position: fixed;
            left: 50%;
            bottom: 90px;
            transform: translateX(-50%) translateY(10px);
            background: var(--color-primary);
            color: #ffffff;
            padding: 8px 16px;
            border-radius: var(--radius-control);
            font-size: 13px;
            box-shadow: var(--shadow-card);
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.2s ease, transform 0.2s ease;
            z-index: 100000;
            max-width: 80vw;
        }
        #xiaoju3-toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

        /* ==================== 移动端响应式（界面文档 §7 规划落地） ==================== */
        /* ≤768px 双栏折叠为单栏。方案：监控侧栏收为可展开抽屉——fixed 定位 +
           translateX 滑入滑出，由聊天头部 ☰ 按钮切换（console.js 给 .sidebar
           加/去 .open 类），聊天区独占整行，输入区保持全宽可用。 */
        @media (max-width: 768px) {
            .sidebar {
                position: fixed;
                left: 0;
                top: 0;
                bottom: 0;
                width: min(80vw, 300px);
                min-width: 0;
                margin: 0;
                border-radius: 0;
                border-right: 1px solid var(--color-border);
                transform: translateX(-105%);
                transition: transform 0.25s ease;
                z-index: 100;
                box-shadow: var(--shadow-card);
            }
            .sidebar.open { transform: translateX(0); }
            #sidebar-toggle { display: inline-flex; }
            .chat-history { padding: 12px; gap: 10px; }
            .message { max-width: 85%; }
            .chat-input-area { padding: 10px 12px; }
            .chat-input-area input { font-size: 16px; }  /* 16px 防 iOS 聚焦自动放大 */
        }

        /* ==================== 加速球（桌宠缩略态） ==================== */
        /* 口径（2026-10-03，PET_BALL_FIX_DESIGN）：⌄ 缩桌宠成球，球跟桌宠
           原位（console.js 进入最小化时从 __xiaoju3Pet.getPos() 实时取坐标），
           控制台（.sidebar + .chat-area）永不隐藏。由 console.js 切换 body
           的 .xiaoju3-pet-minimized 类（互切幂等）：桌宠 .xiaoju-root 隐藏、
           球显示；right/bottom 为 JS 未生效时的兜底位。
           注意（2026-10-03 真机教训）：桌宠由 desktop-pet.js 运行时自建
           .xiaoju-root 节点直挂 document.body（非静态挂载点）——隐藏
           选择器必须配对 .xiaoju-root。 */
        #xiaoju3-ball {
            display: none;                      /* 默认隐藏，最小化态显示 */
            position: fixed;
            right: 24px;
            bottom: 24px;
            width: 60px;                        /* 直径约 60px */
            height: 60px;
            border-radius: 50%;
            border: 3px solid #d96f2b;          /* 橘色 Q 版圆形边框（狐毛同源） */
            box-shadow: 0 4px 14px rgba(217, 111, 43, 0.35);
            overflow: hidden;
            cursor: pointer;
            background: var(--color-card);
            z-index: 99999;                     /* 低于 toast（100000），高于桌宠 */
            touch-action: none;                 /* 指针拖拽不触发页面手势 */
            user-select: none;
        }
        body.xiaoju3-pet-minimized #xiaoju3-ball { display: block; }
        body.xiaoju3-pet-minimized .xiaoju-root { display: none; }   /* 桌宠缩球态：桌宠隐藏（纯类驱动，desktop-pet.js 零 display 控制）；选择器配对运行时自建的 .xiaoju-root */
        #xiaoju3-ball img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
            pointer-events: none;               /* 事件落在球容器，拖拽/点击统一处理 */
        }
        /* 首装引导覆盖层（步 A4b）：z-index 3000 置顶（高于加速球/卡片），
           显隐走 [hidden] 全局兜底；默认 hidden，非引导场景零视觉变化 */
        #first-run-overlay { position: fixed; inset: 0; z-index: 3000; background: rgba(0,0,0,.55); display: flex; align-items: center; justify-content: center; }
        .first-run-card { background: var(--color-panel, #fff); color: var(--color-text, #222); border-radius: 10px; padding: 20px 24px; width: min(520px, 92vw); max-height: 86vh; overflow: auto; box-shadow: 0 8px 30px rgba(0,0,0,.35); }
        .first-run-sub { opacity: .75; margin: 4px 0 10px; }
        .first-run-probes { margin: 0 0 12px; padding-left: 18px; }
        #first-run-install-hints { font-size: 12px; opacity: .75; margin: 0 0 10px; line-height: 1.6; }
        .first-run-field { display: block; margin: 10px 0; }
        .first-run-field span { display: block; font-size: 12px; opacity: .8; margin-bottom: 4px; }
        .first-run-field input { width: 100%; box-sizing: border-box; padding: 6px 8px; border: 1px solid rgba(127,127,127,.4); border-radius: 6px; }
        .first-run-check { display: block; margin: 10px 0; }
        .first-run-error { color: #e0433f; }
        .first-run-hint { color: #2fa24c; }
        .first-run-actions { display: flex; gap: 10px; margin-top: 12px; }
    </style>
    <link rel="icon" href="data:,">
</head>
<body>
    <!-- 首装引导覆盖层（步 A4b）：默认 hidden，仅 first_run 且未跳过时由 console.js 弹出 -->
    <div id="first-run-overlay" hidden>
        <div class="first-run-card">
            <h2>欢迎使用小橘3号</h2>
            <p class="first-run-sub">首次配置：数据只存本机；按需填写，可随时跳过</p>
            <ul id="first-run-probes" class="first-run-probes"></ul>
            <div id="first-run-install-hints" hidden></div>
            <label class="first-run-field">
                <span>DeepSeek API Key（云端对话必需；点「注册 / 充值 DeepSeek」开官方平台，密钥仅存本机）</span>
                <input type="password" id="first-run-deepseek-key" name="DEEPSEEK_API_KEY" placeholder="sk- 开头，粘贴到这里" autocomplete="off">
                <button id="first-run-ds-link" class="header-btn" type="button">注册 / 充值 DeepSeek</button>
            </label>
            <label class="first-run-field">
                <span>Home Assistant 地址（可选，用于主动服务心跳）</span>
                <input type="text" id="first-run-ha-url" name="HA_URL" placeholder="形如 127.0.0.1:8123">
            </label>
            <label class="first-run-field">
                <span>Home Assistant 长期访问令牌（可选）</span>
                <input type="password" id="first-run-ha-token" name="HA_TOKEN" placeholder="HA 长期访问令牌">
            </label>
            <label class="first-run-field">
                <span>本地模型地址（可选，默认 Ollama）</span>
                <input type="text" id="first-run-local-url" name="LOCAL_URL" placeholder="形如 127.0.0.1:11434/api/chat">
            </label>
            <label class="first-run-field">
                <span>所在城市（可选，天气 / 新闻用）</span>
                <input type="text" id="first-run-user-city" name="USER_CITY" placeholder="城市 区县">
            </label>
            <label class="first-run-check">
                <input type="checkbox" id="first-run-autostart" checked> 开机自动启动小橘3号
            </label>
            <p id="first-run-error" class="first-run-error" hidden></p>
            <p id="first-run-restart-hint" class="first-run-hint" hidden>✅ 配置已保存。<b>关闭小橘3号窗口，重新打开即生效</b>（新进程读取你刚填的配置）。</p>
            <div class="first-run-actions">
                <button id="first-run-skip" class="header-btn">跳过，稍后配置</button>
                <button id="first-run-done" class="header-btn">完成并保存</button>
                <button id="first-run-restart-btn" class="header-btn" hidden>关闭窗口</button>
            </div>
        </div>
    </div>
    <!-- 左侧监控面板（移动端收为可展开抽屉） -->
    <div class="sidebar">
        <div class="panel-header">小橘3号 · 系统状态</div>
        <div class="stat-item">
            <div class="stat-label">CPU 占用 <span id="cpu-text">--%</span></div>
            <div class="stat-bar-bg"><div class="stat-bar-fill" id="cpu-bar" style="width: 0%;"></div></div>
        </div>
        <div class="stat-item">
            <div class="stat-label">内存占用 <span id="mem-text">--%</span></div>
            <div class="stat-bar-bg"><div class="stat-bar-fill" id="mem-bar" style="width: 0%;"></div></div>
        </div>
        <div class="stat-item">
            <div class="stat-label">系统温度</div>
            <div class="stat-value" id="temp-text">-- °C</div>
        </div>
        <!-- 待办卡片（2026-10-04 待办提取）：数据=GET /api/todos（console.js
             30 秒轮询），pending 点击标完成（POST /api/todos/<id>/done） -->
        <div class="stat-item todos-card">
            <div class="stat-label">📋 待办 <span id="todos-count-text"></span>
                <span id="todos-edit-gear" class="todos-gear" title="编辑优先级（点切换锁定/解锁）">⚙️</span></div>
            <div class="todos-job" id="todos-job-line" hidden></div>
            <ul class="todos-list" id="todos-list"></ul>
        </div>
        <div class="stat-item" style="margin-top: auto; font-size: 12px; color: var(--color-text-hint); text-align: center;">
            © 2026 小橘3号 Agent
        </div>
    </div>

    <!-- 右侧聊天窗口 -->
    <div class="chat-area">
        <div class="chat-header">
            <!-- 移动端抽屉开关（≤768px 显示） -->
            <button id="sidebar-toggle" class="header-btn" title="监控面板">☰</button>
            <span class="header-title">小橘3号 · 控制台<span id="header-version" class="header-version"></span></span>
            <span class="header-actions">
                <button id="clear-history" class="header-btn" title="清空聊天记录">🧹</button>
                <button id="sound-toggle" class="header-btn" title="音效开关">🔔</button>
                <button id="auto-tts-toggle" class="header-btn" title="自动朗读开关（AI 回复自动播报，与音效独立）">🔇</button>
                <button id="theme-toggle" class="header-btn" title="切换橘色主题">🦊</button>
                <button id="console-minimize" class="header-btn" title="最小化：桌宠缩成加速球">⌄</button>
            </span>
        </div>
        <!-- 聊天标签页：对话窗口 / 终端记录（终端记录只读，切换逻辑在 console.js） -->
        <div class="chat-tabs">
            <button id="tab-console" class="chat-tab active" type="button">对话窗口</button>
            <button id="tab-terminal" class="chat-tab" type="button">终端记录</button>
        </div>
        <div class="chat-history" id="chat-history">
            <div class="message bot-message">你好！我是小橘3号，很高兴为你服务喵~</div>
        </div>
        <!-- 终端记录面板（只读）：GET /api/history?source=terminal，由 console.js 渲染 -->
        <div class="terminal-pane" id="terminal-pane" hidden>
            <div class="terminal-toolbar">
                <span>终端对话记录（只读）· 运行 python xiaoju3.py 产生</span>
                <button id="terminal-refresh" class="header-btn" type="button" title="刷新终端记录">⟳ 刷新</button>
            </div>
            <div class="chat-history terminal-history" id="terminal-history"></div>
        </div>
        <div class="chat-input-area">
            <input type="text" id="chat-input" placeholder="输入消息，按回车发送..." onkeypress="if(event.key === 'Enter') sendMessage()">
            <button onclick="sendMessage()">发送</button>
        </div>
    </div>

    <!-- 加速球（桌宠缩略态，2026-10-03 口径：⌄ 缩桌宠成球，球跟桌宠原位；
         控制台永不缩）。头像 = 小橘半身像 assets/pet/normal_half.png（非桌宠
         DSniang1 素材）；文件缺失时由 console.js 兜底退化为 🦊 emoji 圆球。 -->
    <div id="xiaoju3-ball" title="点击恢复桌宠（可拖拽移动）">
        <img src="/assets/pet/normal_half.png" alt="小橘3号">
    </div>

    <!-- 桌宠挂载说明：desktop-pet.js 运行时自建 .xiaoju-root 节点直挂
         document.body，无静态容器元素（2026-10-03 清理孤儿空 div
         #xiaoju3-root——注释称"注入点"但实现从未使用）。 -->

    <!-- 桌宠完整形态回归（2026-10-02）：desktop-pet.js 重新加载上线。
         三能力齐备（边缘吸附 / 左右翻转 / 随机台词气泡，静态断言见
         test_dashboard.py 桌宠规格组与 test_pet_desktop.py）；
         最小化=桌宠缩球（球跟桌宠原位），控制台永不缩。
         2026-10-01 的下线注释档见 git 历史。 -->
    <script src="/console/desktop-pet.js"></script>
    <script src="/console/console.js"></script>
</body>
</html>

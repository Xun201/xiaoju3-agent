<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>小橘3号控制台</title>
    <style>
        /* 基础重置 */
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow: hidden; 
            height: 100vh;
            display: flex;
            background-color: #f4f6f9;
        }

        /* 左侧监控面板 */
        .sidebar {
            width: 33.33%;
            min-width: 300px;
            background-color: #ffffff;
            border-right: 1px solid #e0e4ec;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 20px;
            box-shadow: 2px 0 10px rgba(0,0,0,0.02);
            z-index: 10;
        }
        .panel-header {
            font-size: 18px;
            font-weight: 600;
            color: #203170;
            border-bottom: 2px solid #eef2fb;
            padding-bottom: 10px;
        }
        .stat-item { display: flex; flex-direction: column; gap: 8px; }
        .stat-label { font-size: 14px; color: #536ba9; display: flex; justify-content: space-between; }
        .stat-bar-bg { width: 100%; height: 8px; background-color: #eef2fb; border-radius: 4px; overflow: hidden; }
        .stat-bar-fill { height: 100%; background-color: #2fa24c; border-radius: 4px; transition: width 0.3s ease, background-color 0.3s ease; }
        .stat-value { font-size: 24px; font-weight: bold; color: #203170; }

        /* 右侧聊天区域 */
        .chat-area {
            flex: 1;
            display: flex;
            flex-direction: column;
            background-color: #f9fbfe;
            position: relative;
        }
        .chat-header {
            padding: 15px 20px;
            font-size: 16px;
            font-weight: 600;
            color: #203170;
            background-color: #ffffff;
            border-bottom: 1px solid #e0e4ec;
        }
        .chat-history {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }
        .message {
            max-width: 70%;
            padding: 10px 15px;
            border-radius: 10px;
            font-size: 14px;
            line-height: 1.5;
            word-wrap: break-word;
        }
        .bot-message { align-self: flex-start; background-color: #ffffff; color: #203170; border: 1px solid #e0e4ec; }
        .user-message { align-self: flex-end; background-color: #203170; color: #ffffff; }
        
        /* 输入框区域 */
        .chat-input-area {
            padding: 15px 20px;
            background-color: #ffffff;
            border-top: 1px solid #e0e4ec;
            display: flex;
            gap: 10px;
        }
        .chat-input-area input {
            flex: 1;
            padding: 10px 15px;
            border: 1px solid #d0d7e5;
            border-radius: 8px;
            outline: none;
            font-size: 14px;
        }
        .chat-input-area button {
            padding: 10px 20px;
            background-color: #203170;
            color: #ffffff;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            transition: background 0.2s;
            flex-shrink: 0;
        }
        .chat-input-area button:hover { background-color: #2f4488; }

        /* ⭐ 新增：AI 消息工具栏按钮样式 */
        .msg-tools {
            display: flex;
            gap: 10px;
            margin-top: 8px;
            opacity: 0.5;
            transition: 0.2s;
        }
        .msg-tools:hover { opacity: 1; }
        .tool-btn {
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 26px;
            height: 26px;
            border-radius: 6px;
            transition: all 0.2s;
            color: #6b7280;
            border: 1px solid transparent;
        }
        .tool-btn:hover {
            background: rgba(0, 0, 0, 0.05);
            color: #1f2937;
            border-color: rgba(0, 0, 0, 0.05);
        }
        /* 点赞、踩的激活状态颜色 */
        .tool-btn.active-like { color: #ef4444; background: #fef2f2; }
        .tool-btn.active-dislike { color: #3b82f6; background: #eff6ff; }
    </style>
    <link rel="icon" href="data:,">
</head>
<body>
    <!-- 左侧监控面板 -->
    <div class="sidebar">
        <div class="panel-header">小橘3号 · 系统状态</div>
        <div class="stat-item">
            <div class="stat-label">CPU 占用 <span id="cpu-text">--%</span></div>
            <div class="stat-bar-bg"><div class="stat-bar-fill" id="cpu-bar" style="width: 0%;"></div></div>
        </div>
        <div class="stat-item">
            <div class="stat-label">内存占用 <span id="mem-text">--%</span></div>
            <div class="stat-bar-bg"><div class="stat-bar-fill" id="mem-bar" style="width: 0%;"></div></div>
        </div>
        <div class="stat-item">
            <div class="stat-label">系统温度</div>
            <div class="stat-value" id="temp-text">-- °C</div>
        </div>
        <div class="stat-item" style="margin-top: auto; font-size: 12px; color: #9fb0d9; text-align: center;">
            © 2026 小橘3号 Agent
        </div>
    </div>

    <!-- 右侧聊天窗口 -->
    <div class="chat-area">
        <div class="chat-header">对话窗口</div>
        <div class="chat-history" id="chat-history">
            <div class="message bot-message">你好！我是小橘3号，很高兴为你服务喵~</div>
        </div>
        <div class="chat-input-area">
            <input type="text" id="chat-input" placeholder="输入消息，按回车发送..." onkeypress="if(event.key === 'Enter') sendMessage()">
            <button onclick="sendMessage()">发送</button>
        </div>
    </div>

    <!-- 挂件容器（保留给大肥鱼） -->
    <div id="xiaoju3-root"></div>
    
    <script src="/console/desktop-pet.js"></script>
    <script src="/console/console.js"></script>
</body>
</html>
